name: Static website checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: find . -name '*.js' -print0 | xargs -0 -n1 node --check
        working-directory: CodeAtlas_Website
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile scraper Python
        run: python -m py_compile scripts/scrape_jobs.py
      - name: Validate local assets and JSON
        run: npm test
        working-directory: CodeAtlas_Website
