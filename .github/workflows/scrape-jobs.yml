name: Refresh public job feed (daily at 10 AM IST)
on:
  push:
    branches: [main]
    paths:
      - "scripts/scrape_jobs.py"
      - "scripts/requirements.txt"
      - "CodeAtlas_Website/data/companies.json"
      - ".github/workflows/scrape-jobs.yml"
  schedule:
    # GitHub cron uses UTC. 04:30 UTC = 10:00 Asia/Kolkata (IST).
    - cron: "30 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-job-feed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install scraper dependency
        run: python -m pip install -r scripts/requirements.txt
      - name: Compile scraper and run refresh regression tests
        run: |
          python -m py_compile scripts/scrape_jobs.py
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Refresh public listings and descriptions
        run: python scripts/scrape_jobs.py
      - name: Validate generated feed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          feed = json.loads(Path("CodeAtlas_Website/data/jobs.json").read_text(encoding="utf-8"))
          assert isinstance(feed.get("jobs"), list), "jobs must be an array"
          for job in feed["jobs"]:
              assert job.get("title") and job.get("company"), "job is missing title/company"
              assert str(job.get("apply_url", "")).startswith("https://"), "job URL must use HTTPS"
              if job.get("company_careers_url"):
                  assert str(job["company_careers_url"]).startswith("https://"), "career URL must use HTTPS"
              assert len(str(job.get("description") or "")) <= 12000, "description too long"
          companies = json.loads(Path("CodeAtlas_Website/data/companies.json").read_text(encoding="utf-8"))
          assert len(companies) >= 30, "Expected broader employer coverage"
          assert all(c.get("careers_url", "").startswith("https://") for c in companies), "Every source needs an HTTPS careers page"
          print(f"Validated {len(feed['jobs'])} listings from {feed.get('companies_checked', 0)} boards")
          PY
      - name: Commit refreshed feed to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CodeAtlas_Website/data/jobs.json CodeAtlas_Website/data/scrape-log.json
          if git diff --cached --quiet; then
            echo "No job feed changes to publish."
            exit 0
          fi
          git commit -m "chore: refresh public job listings [skip ci]"
          git push origin HEAD:main
